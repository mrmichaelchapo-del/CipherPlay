<!DOCTYPE html>
<label for="username">Username:</label>
<input type="text" id="username" class="userbox" placeholder="Enter your username...">

<style>
  .userbox {
    width: 300px;
    padding: 10px;
    font-size: 18px;
  }
</style>

<label for="password">Password:</label>
<input type="text" id="password" class="userbox" placeholder="Enter your password key...">

<style>
  .userbox {
    width: 300px;
    padding: 10px;
    font-size: 18px;
  }
</style>
<button>Log In</button>

<div class="separator"></div>

<style>
  .separator {
    width: 100%;
    height: 2px;
    background-color: #000;
    margin: 20px 0;
  }
</style>
<p>Sign in with:</p>
<div id="appleid-signin"></div>
<script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
<script>
  AppleID.auth.init({
    clientId: "3848_4748_4878",
    scope: "name email",
    redirectURI: "https://cipherplay.com/callback"
  });
</script>
<script>
  localStorage.setItem("loggedIn", "true");
  localStorage.setItem("visitedLogin", "true");
  window.location.href = "/profile.html";
</script>
