<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    .userbox {
      width: 300px;
      padding: 10px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .separator {
      width: 100%;
      height: 2px;
      background-color: #000;
      margin: 20px 0;
    }
  </style>

  <!-- Apple Sign-In Script -->
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
</head>

<body>

  <label for="username">Username:</label>
  <input type="text" id="username" class="userbox" placeholder="Enter your username...">

  <label for="password">Password:</label>
  <input type="text" id="password" class="userbox" placeholder="Enter your password key...">

  <button id="loginBtn">Log In</button>

  <div class="separator"></div>

  <p>Sign in with:</p>
  <div id="appleid-signin"></div>

  <script>
    AppleID.auth.init({
      clientId: "3848_4748_4878",
      scope: "name email",
      redirectURI: "https://cipherplay.com/callback"
    });

    // Only redirect AFTER clicking Log In
    document.getElementById("loginBtn").addEventListener("click", () => {
      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("visitedLogin", "true");
      window.location.href = "/profile.html";
    });
  </script>

</body>
</html>
